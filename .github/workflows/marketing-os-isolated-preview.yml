name: Marketing OS Isolated Exact-SHA Preview

on:
  push:
    branches:
      - fix/marketing-os-p0-release-preflight-20261024

permissions:
  contents: read

concurrency:
  group: marketing-os-isolated-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VERCEL_PROJECT_ID: prj_hfiFu2Ho2LQqSDlqy1oA0TaT4MWw
      VERCEL_ORG_ID: team_oryw9VGF4TLakA4qBU6pGx43
      VERCEL_TEAM_SLUG: kosid-btcs-projects
      VERCEL_TOKEN_PRIMARY: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TOKEN_ACCESS: ${{ secrets.VERCEL_ACCESS_TOKEN }}
      VERCEL_TOKEN_API: ${{ secrets.VERCEL_API_TOKEN }}
      VERCEL_TOKEN_CLI: ${{ secrets.VERCEL_CLI_TOKEN }}
    defaults:
      run:
        working-directory: apps/marketing-os
        shell: bash
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify exact SHA and Marketing OS identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node -e "const p=require('./package.json'); if(p.name!=='@ceo-ai/marketing-os' || !p.scripts.build.includes('next build')) process.exit(1)"
          test -f APPROVED_UI_V4_SOURCE.md
          echo "ISOLATED_PREVIEW_SOURCE_IDENTITY=PASS"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/marketing-os/package-lock.json
      - name: Verify Marketing OS source before Preview build
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run test:approved-ui
          npm run typecheck
      - name: Resolve Vercel token (never log token)
        run: |
          set -euo pipefail
          token="${VERCEL_TOKEN_PRIMARY:-}"
          if [ -z "$token" ]; then token="${VERCEL_TOKEN_ACCESS:-}"; fi
          if [ -z "$token" ]; then token="${VERCEL_TOKEN_API:-}"; fi
          if [ -z "$token" ]; then token="${VERCEL_TOKEN_CLI:-}"; fi
          if [ -z "$token" ]; then echo "::error::VERCEL_TOKEN_UNAVAILABLE"; exit 1; fi
          echo "::add-mask::$token"
          echo "VERCEL_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Bind ONLY local Marketing OS directory to authoritative project
        run: |
          set -euo pipefail
          rm -rf .vercel
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          test "$(node -p "require('./package.json').name")" = "@ceo-ai/marketing-os"
      - name: Pull Preview environment and build from apps/marketing-os
        run: |
          set -euo pipefail
          npx --yes vercel@59.11.7 pull --yes --environment=preview --scope="$VERCEL_TEAM_SLUG" --token="$VERCEL_TOKEN"
          npx --yes vercel@59.11.7 build --scope="$VERCEL_TEAM_SLUG" --token="$VERCEL_TOKEN"
          test -s .vercel/output/config.json
          echo "ISOLATED_NEXTJS_PREBUILT_ARTIFACT=PASS"
      - name: Deploy prebuilt artifact to Preview ONLY
        id: preview
        run: |
          set -euo pipefail
          url="$(npx --yes vercel@59.11.7 deploy --prebuilt --yes --scope="$VERCEL_TEAM_SLUG" --token="$VERCEL_TOKEN")"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "PREVIEW_URL=$url" >> "$GITHUB_STEP_SUMMARY"
          echo "SOURCE_SHA=$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "AUTHENTICATED_VISUAL_PARITY=UNVERIFIED" >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke Preview login identity (not auth/visual acceptance)
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          set -euo pipefail
          npx --yes vercel@59.11.7 curl /login --deployment "$PREVIEW_URL" --scope="$VERCEL_TEAM_SLUG" --token="$VERCEL_TOKEN" > /tmp/marketing-os-preview-login.html
          grep -q 'เข้าสู่ระบบ' /tmp/marketing-os-preview-login.html
          echo "PREVIEW_PUBLIC_LOGIN_IDENTITY=PASS (authenticated UX/UI still UNVERIFIED)" >> "$GITHUB_STEP_SUMMARY"
