name: Marketing OS Approved UI V4 Deployed Preview Visual Gate

on:
  push:
    branches: [feat/marketing-os-approved-ui-v4]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketing-os-approved-ui-v4-deployed-visual-gate
  cancel-in-progress: true

jobs:
  deployed-visual-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN_PRIMARY: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TOKEN_ACCESS: ${{ secrets.VERCEL_ACCESS_TOKEN }}
      VERCEL_TOKEN_API: ${{ secrets.VERCEL_API_TOKEN }}
      VERCEL_TOKEN_CLI: ${{ secrets.VERCEL_CLI_TOKEN }}
      VERCEL_PROJECT_ID: prj_hfiFu2Ho2LQqSDlqy1oA0TaT4MWw
      VERCEL_ORG_ID: team_oryw9VGF4TLakA4qBU6pGx43
      VERCEL_TEAM_SLUG: kosid-btcs-projects
      VISUAL_MAE_THRESHOLD: '0.065'
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Assert exact head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "DEPLOYED_VISUAL_SHA_VERIFIED=$GITHUB_SHA"

      - name: Resolve Vercel credential
        run: |
          set -euo pipefail
          token="${VERCEL_TOKEN_PRIMARY:-}"
          if [ -z "$token" ] && [ -n "${VERCEL_TOKEN_ACCESS:-}" ]; then token="$VERCEL_TOKEN_ACCESS"; fi
          if [ -z "$token" ] && [ -n "${VERCEL_TOKEN_API:-}" ]; then token="$VERCEL_TOKEN_API"; fi
          if [ -z "$token" ] && [ -n "${VERCEL_TOKEN_CLI:-}" ]; then token="$VERCEL_TOKEN_CLI"; fi
          test -n "$token"
          echo "::add-mask::$token"
          echo "VERCEL_TOKEN=$token" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/marketing-os/package-lock.json

      - name: Install Marketing OS dependencies
        working-directory: apps/marketing-os
        run: npm ci --no-audit --no-fund

      - name: Bind authoritative Vercel project
        working-directory: apps/marketing-os
        run: |
          set -euo pipefail
          rm -rf .vercel
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          npx --yes vercel@59.11.7 pull --yes --environment=preview --scope="$VERCEL_TEAM_SLUG" --token="$VERCEL_TOKEN"
          grep -q "$VERCEL_PROJECT_ID" .vercel/project.json
          echo "AUTHORITATIVE_VERCEL_PROJECT=ceo-ai-marketing-os"

      - name: Inject verified public Supabase config
        run: |
          set -euo pipefail
          git fetch origin 'ops/deploy-rc-2bd740b9:refs/remotes/origin/ops/deploy-rc-2bd740b9' --depth=1
          python - <<'PY'
          import re, subprocess
          from pathlib import Path
          source = subprocess.check_output(['git','show','refs/remotes/origin/ops/deploy-rc-2bd740b9:.github/workflows/deploy-marketing-os-rc-production.yml'], text=True)
          url = re.search(r'SUPABASE_PUBLIC_URL:\s*(\S+)', source)
          key = re.search(r'SUPABASE_PUBLISHABLE_KEY:\s*(\S+)', source)
          if not url or not key: raise SystemExit('verified Supabase public config unavailable')
          url = url.group(1).strip().strip('"').strip("'")
          key = key.group(1).strip().strip('"').strip("'")
          if not url.startswith('https://') or not key.startswith('sb_publishable_'): raise SystemExit('unexpected public config format')
          p = Path('apps/marketing-os/.vercel/.env.preview.local')
          old = p.read_text() if p.exists() else ''
          kept = [x for x in old.splitlines() if not x.startswith('NEXT_PUBLIC_SUPABASE_URL=') and not x.startswith('NEXT_PUBLIC_SUPABASE_ANON_KEY=')]
          kept += [f'NEXT_PUBLIC_SUPABASE_URL="{url}"', f'NEXT_PUBLIC_SUPABASE_ANON_KEY="{key}"']
          p.write_text('\n'.join(kept) + '\n')
          print('SUPABASE_PREVIEW_PUBLIC_CONFIG=VERIFIED')
          PY

      - name: Build exact-SHA preview
        working-directory: apps/marketing-os
        run: npx --yes vercel@59.11.7 build --scope="$VERCEL_TEAM_SLUG" --token="$VERCEL_TOKEN"

      - name: Deploy exact-SHA preview
        id: deploy
        working-directory: apps/marketing-os
        run: |
          set -euo pipefail
          url="$(npx --yes vercel@59.11.7 deploy --prebuilt --scope="$VERCEL_TEAM_SLUG" --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "AUTHORITATIVE_PREVIEW_URL=$url"

      - name: Correct-project preview smoke
        working-directory: apps/marketing-os
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          npx --yes vercel@59.11.7 --scope="$VERCEL_TEAM_SLUG" curl /login --deployment "$DEPLOYMENT_URL" > /tmp/login.html
          grep -q 'CEO AI' /tmp/login.html
          grep -q 'เข้าสู่ระบบ' /tmp/login.html
          echo "CORRECT_PROJECT_PREVIEW_SMOKE=PASS"

      - name: Install deployed visual QA tools
        working-directory: apps/marketing-os
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0 vercel@59.11.7
          npx playwright install --with-deps chromium

      - name: Capture and compare deployed visual evidence
        working-directory: apps/marketing-os
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          mkdir -p deployed-visual-qa-artifacts
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { execFile } from 'node:child_process';
          import { promisify } from 'node:util';
          import { extname } from 'node:path';
          import { readFile } from 'node:fs/promises';

          const execFileAsync = promisify(execFile);
          const deployment = process.env.DEPLOYMENT_URL;
          const sha = process.env.GITHUB_SHA;
          const team = process.env.VERCEL_TEAM_SLUG;
          const threshold = Number(process.env.VISUAL_MAE_THRESHOLD ?? '0.065');
          if (!deployment || !sha || !process.env.VERCEL_TOKEN || !team) throw new Error('Missing deployed visual QA inputs');

          const mime = (url, resourceType) => {
            const ext = extname(new URL(url).pathname).toLowerCase();
            if (resourceType === 'document' || ext === '.html') return 'text/html; charset=utf-8';
            if (ext === '.js' || ext === '.mjs' || resourceType === 'script') return 'application/javascript; charset=utf-8';
            if (ext === '.css' || resourceType === 'stylesheet') return 'text/css; charset=utf-8';
            if (ext === '.svg') return 'image/svg+xml';
            if (ext === '.png') return 'image/png';
            if (ext === '.jpg' || ext === '.jpeg') return 'image/jpeg';
            if (ext === '.webp') return 'image/webp';
            if (ext === '.woff2') return 'font/woff2';
            if (ext === '.woff') return 'font/woff';
            return 'application/octet-stream';
          };

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1536, height: 1024 }, deviceScaleFactor: 1 });
          await page.route('**/*', async (route) => {
            const request = route.request();
            const url = request.url();
            if (!url.startsWith(`${deployment}/`)) return route.continue();
            try {
              const { stdout } = await execFileAsync(
                './node_modules/.bin/vercel',
                [`--scope=${team}`, 'curl', url],
                { encoding: 'buffer', maxBuffer: 32 * 1024 * 1024, env: process.env },
              );
              await route.fulfill({ status: 200, body: stdout, contentType: mime(url, request.resourceType()) });
            } catch (error) {
              console.error(`VERCEL_CURL_PROXY_FAILURE=${url}`);
              console.error(error?.stderr?.toString?.().slice(0, 2000) ?? error);
              await route.abort();
            }
          });

          const pixels96x64 = async (buffer) => {
            const p = await browser.newPage({ viewport: { width: 96, height: 64 }, deviceScaleFactor: 1 });
            try {
              return await p.evaluate(async (dataUrl) => {
                const image = new Image();
                image.src = dataUrl;
                await image.decode();
                const canvas = document.createElement('canvas');
                canvas.width = 96;
                canvas.height = 64;
                const ctx = canvas.getContext('2d', { willReadFrequently: true });
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                ctx.drawImage(image, 0, 0, 96, 64);
                return Array.from(ctx.getImageData(0, 0, 96, 64).data);
              }, `data:image/png;base64,${buffer.toString('base64')}`);
            } finally {
              await p.close();
            }
          };

          const rgbMae = (a, b) => {
            if (a.length !== b.length) throw new Error('Fingerprint dimensions differ');
            let sum = 0, channels = 0;
            for (let i = 0; i < a.length; i += 4) {
              sum += Math.abs(a[i] - b[i]) + Math.abs(a[i + 1] - b[i + 1]) + Math.abs(a[i + 2] - b[i + 2]);
              channels += 3;
            }
            return sum / channels / 255;
          };

          try {
            await page.goto(`${deployment}/visual-qa/home?visualQa=${encodeURIComponent(sha)}`, { waitUntil: 'networkidle' });
            const root = page.locator('[data-visual-qa="preview-fixture"]');
            await root.waitFor({ state: 'visible', timeout: 20000 });
            if ((await page.locator('.metric-card').count()) !== 6) throw new Error('Approved desktop requires exactly six KPI cards');
            for (const selector of ['.performance-panel','.traffic-source','.ai-panel','.genome-panel','.mit-panel','.recent-panel','.platform-panel']) {
              if (!(await page.locator(selector).isVisible())) throw new Error(`Approved desktop missing ${selector}`);
            }

            const desktop = await page.screenshot({ path: 'deployed-visual-qa-artifacts/desktop-1536x1024.png', fullPage: false });
            const deployedPixels = await pixels96x64(desktop);
            const mainPixels = await pixels96x64(await readFile('visual-authority/0D291464-3F4B-4AD2-B7BE-C5409EC56B4F.96x64.png'));
            const variantPixels = await pixels96x64(await readFile('visual-authority/4C6D6E63-535F-4E43-BD88-FD10F31624DC.96x64.png'));
            const mainMae = rgbMae(deployedPixels, mainPixels);
            const variantMae = rgbMae(deployedPixels, variantPixels);
            console.log(`APPROVED_MAIN_VISUAL_MAE=${mainMae.toFixed(6)}`);
            console.log(`APPROVED_VARIANT_VISUAL_MAE=${variantMae.toFixed(6)}`);
            console.log(`APPROVED_VISUAL_MAE_THRESHOLD=${threshold.toFixed(6)}`);
            if (mainMae > threshold || variantMae > threshold) {
              throw new Error(`Deployed screenshot diverges from approved sources: main=${mainMae.toFixed(6)}, variant=${variantMae.toFixed(6)}, threshold=${threshold}`);
            }

            await page.setViewportSize({ width: 390, height: 844 });
            await page.waitForTimeout(600);
            if ((await page.locator('.metric-card').count()) !== 6) throw new Error('Approved mobile requires all six KPI cards');
            const performanceBox = await page.locator('.performance-panel').boundingBox();
            const aiBox = await page.locator('.ai-panel').boundingBox();
            if (!performanceBox || !aiBox || performanceBox.y >= aiBox.y) throw new Error('Approved mobile hierarchy requires Performance before AI Recommendations');
            const mobileTitle = page.locator('.dashboard-title-row h1');
            if (!(await mobileTitle.isVisible()) || (await mobileTitle.textContent())?.trim() !== 'CEO AI Thailand') throw new Error('CEO AI title branding missing on mobile');
            const mobileLogoBackground = await page.locator('.topbar').evaluate((node) => getComputedStyle(node, '::before').backgroundImage);
            if (!mobileLogoBackground.includes('ceo-ai-reference-logo.svg')) throw new Error('CEO AI logo branding missing on mobile');
            await page.screenshot({ path: 'deployed-visual-qa-artifacts/mobile-390x844.png', fullPage: true });

            console.log(`DEPLOYED_VISUAL_QA_SHA=${sha}`);
            console.log('DEPLOYED_VISUAL_STRUCTURE=PASS');
            console.log('DEPLOYED_APPROVED_SOURCE_FIDELITY=PASS');
            console.log('APPROVED_SOURCE_CONTRACT=0D291464-3F4B-4AD2-B7BE-C5409EC56B4F.jpeg|4C6D6E63-535F-4E43-BD88-FD10F31624DC.jpeg|0D291464-3F4B-4AD2-B7BE-C5409EC56B4F(1).jpeg');
          } finally {
            await browser.close();
          }
          NODE

      - name: Upload deployed visual QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: approved-ui-v4-deployed-visual-qa-${{ github.sha }}
          path: apps/marketing-os/deployed-visual-qa-artifacts/*.png
          if-no-files-found: error
          retention-days: 7
