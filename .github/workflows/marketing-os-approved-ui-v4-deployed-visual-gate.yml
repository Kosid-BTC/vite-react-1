name: Marketing OS Approved UI V4 Deployed Preview Visual Gate

on:
  push:
    branches:
      - feat/marketing-os-approved-ui-v4
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketing-os-approved-ui-v4-deployed-visual-gate
  cancel-in-progress: true

jobs:
  deployed-visual-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERCEL_TOKEN_PRIMARY: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TOKEN_ACCESS: ${{ secrets.VERCEL_ACCESS_TOKEN }}
      VERCEL_TOKEN_API: ${{ secrets.VERCEL_API_TOKEN }}
      VERCEL_TOKEN_CLI: ${{ secrets.VERCEL_CLI_TOKEN }}
      VERCEL_PROJECT_ID: prj_hfiFu2Ho2LQqSDlqy1oA0TaT4MWw
      VERCEL_ORG_ID: team_oryw9VGF4TLakA4qBU6pGx43
      VERCEL_TEAM_SLUG: kosid-btcs-projects
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Assert exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "DEPLOYED_VISUAL_SHA_VERIFIED=$GITHUB_SHA"

      - name: Resolve Vercel credential
        shell: bash
        run: |
          set -euo pipefail
          token="${VERCEL_TOKEN_PRIMARY:-}"
          if [ -z "$token" ] && [ -n "${VERCEL_TOKEN_ACCESS:-}" ]; then token="$VERCEL_TOKEN_ACCESS"; fi
          if [ -z "$token" ] && [ -n "${VERCEL_TOKEN_API:-}" ]; then token="$VERCEL_TOKEN_API"; fi
          if [ -z "$token" ] && [ -n "${VERCEL_TOKEN_CLI:-}" ]; then token="$VERCEL_TOKEN_CLI"; fi
          test -n "$token"
          echo "::add-mask::$token"
          echo "VERCEL_TOKEN=$token" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/marketing-os/package-lock.json

      - name: Install Marketing OS dependencies
        working-directory: apps/marketing-os
        run: npm ci --no-audit --no-fund

      - name: Bind authoritative Vercel project
        working-directory: apps/marketing-os
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .vercel
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          npx --yes vercel@latest pull --yes --environment=preview --scope="$VERCEL_TEAM_SLUG" --token="$VERCEL_TOKEN"
          grep -q "$VERCEL_PROJECT_ID" .vercel/project.json
          echo "AUTHORITATIVE_VERCEL_PROJECT=ceo-ai-marketing-os"

      - name: Inject verified public Supabase config
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin 'ops/deploy-rc-2bd740b9:refs/remotes/origin/ops/deploy-rc-2bd740b9' --depth=1
          python - <<'PY'
          import re, subprocess
          from pathlib import Path
          source = subprocess.check_output(['git','show','refs/remotes/origin/ops/deploy-rc-2bd740b9:.github/workflows/deploy-marketing-os-rc-production.yml'], text=True)
          url = re.search(r'SUPABASE_PUBLIC_URL:\s*(\S+)', source)
          key = re.search(r'SUPABASE_PUBLISHABLE_KEY:\s*(\S+)', source)
          if not url or not key:
              raise SystemExit('verified Supabase public config unavailable')
          url = url.group(1).strip().strip('"').strip("'")
          key = key.group(1).strip().strip('"').strip("'")
          if not url.startswith('https://') or not key.startswith('sb_publishable_'):
              raise SystemExit('unexpected public config format')
          p = Path('apps/marketing-os/.vercel/.env.preview.local')
          p.parent.mkdir(parents=True, exist_ok=True)
          old = p.read_text() if p.exists() else ''
          kept = [x for x in old.splitlines() if not x.startswith('NEXT_PUBLIC_SUPABASE_URL=') and not x.startswith('NEXT_PUBLIC_SUPABASE_ANON_KEY=')]
          kept += [f'NEXT_PUBLIC_SUPABASE_URL="{url}"', f'NEXT_PUBLIC_SUPABASE_ANON_KEY="{key}"']
          p.write_text('\n'.join(kept) + '\n')
          print('SUPABASE_PREVIEW_PUBLIC_CONFIG=VERIFIED')
          PY

      - name: Build exact-SHA preview
        working-directory: apps/marketing-os
        run: npx --yes vercel@latest build --scope="$VERCEL_TEAM_SLUG" --token="$VERCEL_TOKEN"

      - name: Deploy exact-SHA preview
        id: deploy
        working-directory: apps/marketing-os
        shell: bash
        run: |
          set -euo pipefail
          url="$(npx --yes vercel@latest deploy --prebuilt --scope="$VERCEL_TEAM_SLUG" --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "AUTHORITATIVE_PREVIEW_URL=$url"

      - name: Correct-project preview smoke
        working-directory: apps/marketing-os
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@latest --scope="$VERCEL_TEAM_SLUG" curl /login --deployment "$DEPLOYMENT_URL" > /tmp/login.html
          grep -q 'CEO AI' /tmp/login.html
          grep -q 'เข้าสู่ระบบ' /tmp/login.html
          echo "CORRECT_PROJECT_PREVIEW_SMOKE=PASS"

      - name: Enforce deployed authenticated screenshot evidence
        shell: bash
        run: |
          set -euo pipefail
          echo "DEPLOYED_AUTHENTICATED_VISUAL_QA=UNVERIFIED"
          echo "Local authenticated screenshots are structural evidence only and MUST NOT satisfy deployed Preview visual fidelity."
          echo "Release remains blocked until desktop and mobile dashboard screenshots are captured from this exact deployed Preview and compared only with the three approved source screenshots."
          echo "::error::Missing exact-SHA deployed authenticated dashboard screenshot comparison evidence. Fail closed."
          exit 1
