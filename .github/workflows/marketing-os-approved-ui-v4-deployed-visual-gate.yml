name: Marketing OS Approved UI V4 Authenticated Preview Visual Gate

on:
  push:
    branches: [feat/marketing-os-approved-ui-v4, fix/marketing-os-release-gates-v5, fix/marketing-os-p0-release-preflight-20261024]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketing-os-approved-ui-v4-deployed-visual-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deployed-visual-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERCEL_TOKEN_PRIMARY: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TOKEN_ACCESS: ${{ secrets.VERCEL_ACCESS_TOKEN }}
      VERCEL_TOKEN_API: ${{ secrets.VERCEL_API_TOKEN }}
      VERCEL_TOKEN_CLI: ${{ secrets.VERCEL_CLI_TOKEN }}
      VERCEL_PROJECT_ID: prj_hfiFu2Ho2LQqSDlqy1oA0TaT4MWw
      VERCEL_ORG_ID: team_oryw9VGF4TLakA4qBU6pGx43
      VERCEL_TEAM_SLUG: kosid-btcs-projects
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Assert exact head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "DEPLOYED_VISUAL_SHA_VERIFIED=$GITHUB_SHA"

      - name: Resolve Vercel credential
        run: |
          set -euo pipefail
          token="${VERCEL_TOKEN_PRIMARY:-}"
          if [ -z "$token" ] && [ -n "${VERCEL_TOKEN_ACCESS:-}" ]; then token="$VERCEL_TOKEN_ACCESS"; fi
          if [ -z "$token" ] && [ -n "${VERCEL_TOKEN_API:-}" ]; then token="$VERCEL_TOKEN_API"; fi
          if [ -z "$token" ] && [ -n "${VERCEL_TOKEN_CLI:-}" ]; then token="$VERCEL_TOKEN_CLI"; fi
          test -n "$token"
          echo "::add-mask::$token"
          echo "VERCEL_TOKEN=$token" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/marketing-os/package-lock.json

      - name: Install Marketing OS dependencies
        working-directory: apps/marketing-os
        run: npm ci --no-audit --no-fund

      - name: Bind authoritative Vercel project
        working-directory: apps/marketing-os
        run: |
          set -euo pipefail
          rm -rf .vercel
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          npx --yes vercel@59.11.7 pull --yes --environment=preview --scope="$VERCEL_TEAM_SLUG" --token="$VERCEL_TOKEN"
          grep -q "$VERCEL_PROJECT_ID" .vercel/project.json
          echo "AUTHORITATIVE_VERCEL_PROJECT=ceo-ai-marketing-os"

      - name: Validate authoritative Preview Supabase public config
        working-directory: apps/marketing-os
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = '.vercel/.env.preview.local';
          if (!fs.existsSync(path)) {
            console.error('::error::AUTHORITATIVE_PREVIEW_ENV_FILE_MISSING');
            process.exit(1);
          }
          process.loadEnvFile(path);
          const url = (process.env.NEXT_PUBLIC_SUPABASE_URL || '').trim();
          const key = (process.env.NEXT_PUBLIC_SUPABASE_ANON_KEY || '').trim();
          if (!url || !key) {
            console.error('::error::AUTHORITATIVE_PREVIEW_PUBLIC_AUTH_CONFIG_MISSING');
            process.exit(1);
          }
          try {
            if (new URL(url).protocol !== 'https:') throw new Error();
          } catch {
            console.error('::error::AUTHORITATIVE_PREVIEW_SUPABASE_URL_INVALID');
            process.exit(1);
          }
          if (!(key.startsWith('sb_publishable_') || key.startsWith('eyJ'))) {
            console.error('::error::AUTHORITATIVE_PREVIEW_PUBLIC_KEY_FORMAT_UNVERIFIED');
            process.exit(1);
          }
          console.log('AUTHORITATIVE_PREVIEW_SUPABASE_PUBLIC_CONFIG=PASS (values redacted)');
          NODE

      - name: Build exact-SHA preview
        working-directory: apps/marketing-os
        run: npx --yes vercel@59.11.7 build --scope="$VERCEL_TEAM_SLUG" --token="$VERCEL_TOKEN"

      - name: Deploy exact-SHA preview
        id: deploy
        working-directory: apps/marketing-os
        run: |
          set -euo pipefail
          url="$(npx --yes vercel@59.11.7 deploy --prebuilt --scope="$VERCEL_TEAM_SLUG" --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "AUTHORITATIVE_PREVIEW_URL=$url"

      - name: Correct-project preview smoke
        working-directory: apps/marketing-os
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          npx --yes vercel@59.11.7 --scope="$VERCEL_TEAM_SLUG" curl /login --deployment "$DEPLOYMENT_URL" > /tmp/login.html
          grep -q 'CEO AI' /tmp/login.html
          grep -q 'เข้าสู่ระบบ' /tmp/login.html
          echo "CORRECT_PROJECT_PREVIEW_SMOKE=PASS"

      - name: Install deployed visual QA tools
        working-directory: apps/marketing-os
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0 vercel@59.11.7 sharp@0.34.3
          npx playwright install --with-deps chromium

      - name: Capture authenticated desktop/mobile against both locked references
        working-directory: apps/marketing-os
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
          ACCEPTANCE_TARGET: candidate
          ARTIFACT_DIR: deployed-visual-qa-artifacts
          MARKETING_OS_E2E_EMAIL: ${{ secrets.MARKETING_OS_E2E_EMAIL }}
          MARKETING_OS_E2E_PASSWORD: ${{ secrets.MARKETING_OS_E2E_PASSWORD }}
          MARKETING_OS_E2E_WORKSPACE_SLUG: ${{ vars.MARKETING_OS_E2E_WORKSPACE_SLUG }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/verify-production-acceptance.mjs

      - name: Upload deployed visual QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: approved-ui-v4-deployed-visual-qa-${{ github.sha }}
          path: apps/marketing-os/deployed-visual-qa-artifacts/*
          if-no-files-found: error
          retention-days: 7
