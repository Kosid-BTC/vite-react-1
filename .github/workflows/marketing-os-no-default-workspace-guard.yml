name: Marketing OS no-default-workspace guard
on:
  push:
    branches:
      - 'feat/marketing-os-ceo-backoffice-intelligence-contract'
  pull_request:
    paths:
      - 'apps/marketing-os/src/**'
      - 'apps/marketing-os/app/**'
      - 'apps/marketing-os/pages/**'
      - 'apps/marketing-os/components/**'
      - 'apps/marketing-os/server/**'
      - 'apps/marketing-os/supabase/functions/**'
      - 'apps/marketing-os/scripts/verify-no-default-workspace-rpc.mjs'
      - '.github/workflows/marketing-os-no-default-workspace-guard.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-default-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/marketing-os
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject implicit first-workspace RPC callsites
        run: node scripts/verify-no-default-workspace-rpc.mjs
