name: Marketing OS Approved UI V4 Validation

on:
  push:
    branches:
      - feat/marketing-os-approved-ui-v4
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketing-os-approved-ui-v4-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assert exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/marketing-os/package-lock.json
      - name: Install
        working-directory: apps/marketing-os
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        working-directory: apps/marketing-os
        run: npm run typecheck
      - name: Closed-loop regression
        working-directory: apps/marketing-os
        run: npm run test:dashboard-closed-loop
      - name: Auth recovery regression
        working-directory: apps/marketing-os
        run: npm run test:auth-recovery
      - name: Build
        working-directory: apps/marketing-os
        run: npm run build
      - name: Approved screenshot contract assertions
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/marketing-os/APPROVED_UI_V4_SOURCE.md
          test -f apps/marketing-os/src/app/approved-ui-v4.css
          grep -q 'grid-auto-flow: column' apps/marketing-os/src/app/approved-ui-v4.css
          grep -q 'metric-card:nth-child(n+5)' apps/marketing-os/src/app/approved-ui-v4.css
          grep -q 'display: block' apps/marketing-os/src/app/approved-ui-v4.css
          grep -q 'performance-panel { order: 1' apps/marketing-os/src/app/approved-ui-v4.css
          grep -q 'ai-panel { order: 2' apps/marketing-os/src/app/approved-ui-v4.css
          grep -q "url('/ceo-ai-reference-logo.svg')" apps/marketing-os/src/app/approved-ui-v4.css
          echo APPROVED_UI_V4_STRUCTURE=PASS
      - name: Diff whitespace check
        run: git diff --check origin/feat/marketing-os-phase1...HEAD
