name: Marketing OS cross-project read guard
on:
  push:
    branches:
      - 'fix/marketing-os-dual-db-security-gates'
  pull_request:
    paths:
      - 'apps/marketing-os/src/lib/supabase/supplementary-boundary.ts'
      - 'apps/marketing-os/src/lib/supabase/supplementary-readonly.ts'
      - 'apps/marketing-os/scripts/verify-dual-supabase-boundary.mjs'
      - '.github/workflows/marketing-os-cross-project-read-guard.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cross-project-read-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/marketing-os
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify no cross-project read before security acceptance
        run: node scripts/verify-dual-supabase-boundary.mjs
