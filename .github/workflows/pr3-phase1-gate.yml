name: PR3 Phase 1 Gate

on:
  push:
    branches:
      - feat/marketing-os-phase1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app-validation:
    name: App validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Root regression suite
        run: npm run test:run

      - name: Root build
        run: npm run build

      - name: Root lint
        run: npm run lint

      - name: Install Marketing OS dependencies
        working-directory: apps/marketing-os
        run: npm install --no-audit --no-fund

      - name: Marketing OS typecheck
        working-directory: apps/marketing-os
        run: npm run typecheck

      - name: Marketing OS build
        working-directory: apps/marketing-os
        run: npm run build

      - name: Diff whitespace check
        run: git diff --check origin/main...HEAD

  authenticated-rls:
    name: Authenticated JWT / RLS integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Docker
        run: docker info

      - name: Start disposable local Supabase
        run: npx --yes supabase@2.40.0 start

      - name: Migration reset / reapply #1
        run: npx --yes supabase@2.40.0 db reset --local

      - name: Migration reset / reapply #2
        run: npx --yes supabase@2.40.0 db reset --local

      - name: Authenticated JWT RLS CRUD verification
        shell: bash
        run: |
          set -euo pipefail
          eval "$(npx --yes supabase@2.40.0 status -o env)"
          export SUPABASE_URL="$API_URL"
          export SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          node apps/marketing-os/scripts/verify-phase1-rls.mjs

      - name: Stop disposable local Supabase
        if: always()
        run: npx --yes supabase@2.40.0 stop --no-backup
