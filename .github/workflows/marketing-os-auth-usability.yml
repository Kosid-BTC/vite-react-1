name: Marketing OS Auth Usability

on:
  push:
    branches:
      - feat/marketing-os-phase1
    paths:
      - 'apps/marketing-os/src/app/login/**'
      - 'apps/marketing-os/src/app/auth/**'
      - 'apps/marketing-os/src/app/account/update-password/**'
      - 'apps/marketing-os/src/middleware.ts'
      - 'apps/marketing-os/src/lib/supabase/server.ts'
      - 'apps/marketing-os/scripts/verify-auth-recovery-contract.mjs'
      - 'apps/marketing-os/package.json'
      - 'apps/marketing-os/package-lock.json'
      - '.github/workflows/marketing-os-auth-usability.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/marketing-os/src/app/login/**'
      - 'apps/marketing-os/src/app/auth/**'
      - 'apps/marketing-os/src/app/account/update-password/**'
      - 'apps/marketing-os/src/middleware.ts'
      - 'apps/marketing-os/src/lib/supabase/server.ts'
      - 'apps/marketing-os/scripts/verify-auth-recovery-contract.mjs'
      - 'apps/marketing-os/package.json'
      - 'apps/marketing-os/package-lock.json'
      - '.github/workflows/marketing-os-auth-usability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-usability:
    name: Auth recovery + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/marketing-os
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/marketing-os/package-lock.json
      - name: Deterministic install
        run: npm ci --no-audit --no-fund
      - name: Auth recovery contract
        run: npm run test:auth-recovery
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
