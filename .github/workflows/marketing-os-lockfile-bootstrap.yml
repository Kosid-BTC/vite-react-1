name: Marketing OS Lockfile Bootstrap

on:
  push:
    branches:
      - feat/marketing-os-phase1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap-lockfile:
    if: ${{ github.ref == 'refs/heads/feat/marketing-os-phase1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/marketing-os-phase1
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: https://registry.npmjs.org
      - name: Generate Marketing OS package-lock if missing
        working-directory: apps/marketing-os
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            echo 'package-lock.json already exists; nothing to bootstrap.'
            exit 0
          fi
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile to feature branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/marketing-os/package-lock.json; then
            echo 'No lockfile change to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/marketing-os/package-lock.json
          git commit -m 'chore(marketing-os): commit deterministic package lock'
          git push origin HEAD:feat/marketing-os-phase1
