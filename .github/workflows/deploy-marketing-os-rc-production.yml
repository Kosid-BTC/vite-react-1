name: Deploy Marketing OS RC to Production

on:
  push:
    branches:
      - ops/deploy-rc-2bd740b9

permissions:
  contents: read

jobs:
  deploy-production:
    name: Deploy exact RC 2bd740b9 to Vercel production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN_PRIMARY: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TOKEN_ACCESS: ${{ secrets.VERCEL_ACCESS_TOKEN }}
      VERCEL_TOKEN_API: ${{ secrets.VERCEL_API_TOKEN }}
      VERCEL_TOKEN_CLI: ${{ secrets.VERCEL_CLI_TOKEN }}
      RC_SHA: 2bd740b9e743d58a2163893a57cf59f3ea7d89d7
      VERCEL_PROJECT_ID: prj_hfiFu2Ho2LQqSDlqy1oA0TaT4MWw
      VERCEL_ORG_ID: team_oryw9VGF4TLakA4qBU6pGx43
      VERCEL_TEAM_SLUG: kosid-btcs-projects
    steps:
      - name: Checkout exact release candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RC_SHA }}
          fetch-depth: 1

      - name: Assert exact release candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RC_SHA"
          echo "RC_SHA_VERIFIED=$RC_SHA"

      - name: Resolve Vercel deployment credential
        shell: bash
        run: |
          set -euo pipefail
          token="${VERCEL_TOKEN_PRIMARY:-}"
          source_name="VERCEL_TOKEN"
          if [ -z "$token" ] && [ -n "${VERCEL_TOKEN_ACCESS:-}" ]; then token="$VERCEL_TOKEN_ACCESS"; source_name="VERCEL_ACCESS_TOKEN"; fi
          if [ -z "$token" ] && [ -n "${VERCEL_TOKEN_API:-}" ]; then token="$VERCEL_TOKEN_API"; source_name="VERCEL_API_TOKEN"; fi
          if [ -z "$token" ] && [ -n "${VERCEL_TOKEN_CLI:-}" ]; then token="$VERCEL_TOKEN_CLI"; source_name="VERCEL_CLI_TOKEN"; fi
          if [ -z "$token" ]; then
            echo "No supported Vercel deployment credential is configured in GitHub Actions secrets." >&2
            exit 78
          fi
          echo "VERCEL_TOKEN=$token" >> "$GITHUB_ENV"
          echo "VERCEL_CREDENTIAL_SOURCE=$source_name"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/marketing-os/package-lock.json

      - name: Install application dependencies
        working-directory: apps/marketing-os
        run: npm ci --no-audit --no-fund

      - name: Link exact Vercel project
        working-directory: apps/marketing-os
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          npx --yes vercel@latest pull --yes --environment=production --scope="$VERCEL_TEAM_SLUG" --token="$VERCEL_TOKEN"

      - name: Build production artifact
        working-directory: apps/marketing-os
        run: npx --yes vercel@latest build --prod --scope="$VERCEL_TEAM_SLUG" --token="$VERCEL_TOKEN"

      - name: Deploy production artifact
        id: deploy
        working-directory: apps/marketing-os
        shell: bash
        run: |
          set -euo pipefail
          url="$(npx --yes vercel@latest deploy --prebuilt --prod --scope="$VERCEL_TEAM_SLUG" --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "DEPLOYMENT_URL=$url"

      - name: Public smoke test
        shell: bash
        run: |
          set -euo pipefail
          url='${{ steps.deploy.outputs.url }}'
          curl --fail --silent --show-error --location --max-time 30 "$url/login" >/tmp/login.html
          grep -q 'CEO AI' /tmp/login.html
          echo "PRODUCTION_PUBLIC_SMOKE=PASS"
