name: Marketing OS Edge Function Workspace Binding Guard

on:
  pull_request:
    paths:
      - 'apps/marketing-os/supabase/**'
      - 'apps/marketing-os/scripts/verify-marketing-behavior-workspace-binding.mjs'
      - '.github/workflows/marketing-os-edge-function-workspace-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketing-os-edge-function-workspace-guard
  cancel-in-progress: true

jobs:
  workspace-binding:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact source SHA
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          echo "EDGE_FUNCTION_SOURCE_SHA=$expected"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify environment-local workspace binding
        run: node apps/marketing-os/scripts/verify-marketing-behavior-workspace-binding.mjs
