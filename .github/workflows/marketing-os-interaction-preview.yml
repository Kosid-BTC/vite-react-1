name: Marketing OS Interaction Preview

on:
  push:
    branches:
      - fix/marketing-os-interactions-v4

permissions:
  contents: read

concurrency:
  group: marketing-os-interaction-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN_PRIMARY: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TOKEN_ACCESS: ${{ secrets.VERCEL_ACCESS_TOKEN }}
      VERCEL_TOKEN_API: ${{ secrets.VERCEL_API_TOKEN }}
      VERCEL_TOKEN_CLI: ${{ secrets.VERCEL_CLI_TOKEN }}
      VERCEL_PROJECT_ID: prj_hfiFu2Ho2LQqSDlqy1oA0TaT4MWw
      VERCEL_ORG_ID: team_oryw9VGF4TLakA4qBU6pGx43
      VERCEL_TEAM_SLUG: kosid-btcs-projects
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Assert exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "INTERACTION_SHA_VERIFIED=$GITHUB_SHA"

      - name: Resolve Vercel credential
        shell: bash
        run: |
          set -euo pipefail
          token="${VERCEL_TOKEN_PRIMARY:-}"
          if [ -z "$token" ] && [ -n "${VERCEL_TOKEN_ACCESS:-}" ]; then token="$VERCEL_TOKEN_ACCESS"; fi
          if [ -z "$token" ] && [ -n "${VERCEL_TOKEN_API:-}" ]; then token="$VERCEL_TOKEN_API"; fi
          if [ -z "$token" ] && [ -n "${VERCEL_TOKEN_CLI:-}" ]; then token="$VERCEL_TOKEN_CLI"; fi
          test -n "$token"
          echo "::add-mask::$token"
          echo "VERCEL_TOKEN=$token" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/marketing-os/package-lock.json

      - name: Install
        working-directory: apps/marketing-os
        run: npm ci --no-audit --no-fund

      - name: Bind correct Vercel project
        working-directory: apps/marketing-os
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .vercel
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          npx --yes vercel@59.11.7 pull --yes --environment=preview --scope="$VERCEL_TEAM_SLUG" --token="$VERCEL_TOKEN"
          grep -q "$VERCEL_PROJECT_ID" .vercel/project.json
          echo AUTHORITATIVE_VERCEL_PROJECT=ceo-ai-marketing-os

      - name: Inject exact preview QA SHA
        working-directory: apps/marketing-os
        shell: bash
        run: |
          set -euo pipefail
          printf '\nVERCEL_GIT_COMMIT_SHA="%s"\nVISUAL_QA_COMMIT_SHA="%s"\n' "$GITHUB_SHA" "$GITHUB_SHA" >> .vercel/.env.preview.local
          grep -q "VISUAL_QA_COMMIT_SHA=\"$GITHUB_SHA\"" .vercel/.env.preview.local
          echo PREVIEW_QA_SHA_INJECTED="$GITHUB_SHA"

      - name: Inject verified public Supabase config
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin 'ops/deploy-rc-2bd740b9:refs/remotes/origin/ops/deploy-rc-2bd740b9' --depth=1
          python - <<'PY'
          import re, subprocess
          from pathlib import Path
          source = subprocess.check_output(['git','show','refs/remotes/origin/ops/deploy-rc-2bd740b9:.github/workflows/deploy-marketing-os-rc-production.yml'], text=True)
          url = re.search(r'SUPABASE_PUBLIC_URL:\s*(\S+)', source)
          key = re.search(r'SUPABASE_PUBLISHABLE_KEY:\s*(\S+)', source)
          if not url or not key: raise SystemExit('verified Supabase public config unavailable')
          url = url.group(1).strip().strip('"').strip("'")
          key = key.group(1).strip().strip('"').strip("'")
          if not url.startswith('https://') or not key.startswith('sb_publishable_'):
              raise SystemExit('unexpected public config format')
          p = Path('apps/marketing-os/.vercel/.env.preview.local')
          old = p.read_text() if p.exists() else ''
          kept = [line for line in old.splitlines() if not line.startswith('NEXT_PUBLIC_SUPABASE_URL=') and not line.startswith('NEXT_PUBLIC_SUPABASE_ANON_KEY=')]
          kept += [f'NEXT_PUBLIC_SUPABASE_URL="{url}"', f'NEXT_PUBLIC_SUPABASE_ANON_KEY="{key}"']
          p.write_text('\n'.join(kept) + '\n')
          print('SUPABASE_PREVIEW_PUBLIC_CONFIG=VERIFIED')
          PY
          grep -q '^NEXT_PUBLIC_SUPABASE_URL="https://' apps/marketing-os/.vercel/.env.preview.local
          grep -q '^NEXT_PUBLIC_SUPABASE_ANON_KEY="sb_publishable_' apps/marketing-os/.vercel/.env.preview.local

      - name: Build preview
        working-directory: apps/marketing-os
        run: npx --yes vercel@59.11.7 build --scope="$VERCEL_TEAM_SLUG" --token="$VERCEL_TOKEN"

      - name: Deploy preview
        id: deploy
        working-directory: apps/marketing-os
        shell: bash
        run: |
          set -euo pipefail
          url="$(npx --yes vercel@59.11.7 deploy --prebuilt --scope="$VERCEL_TEAM_SLUG" --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "INTERACTION_PREVIEW_URL=$url"

      - name: Install interaction E2E tools
        working-directory: apps/marketing-os
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0 vercel@59.11.7
          npx playwright install --with-deps chromium

      - name: Protected preview interaction E2E
        working-directory: apps/marketing-os
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-deployed-interactions.mjs

      - name: Preview middleware runtime smoke
        working-directory: apps/marketing-os
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@59.11.7 --scope="$VERCEL_TEAM_SLUG" curl /login --deployment "$DEPLOYMENT_URL" > /tmp/marketing-login.html
          grep -q 'เข้าสู่ระบบ' /tmp/marketing-login.html
          npx --yes vercel@59.11.7 --scope="$VERCEL_TEAM_SLUG" curl "/visual-qa/home?visualQa=$GITHUB_SHA" --deployment "$DEPLOYMENT_URL" > /tmp/marketing-home.html
          grep -q 'data-visual-qa="preview-fixture"' /tmp/marketing-home.html
          echo PREVIEW_MIDDLEWARE_RUNTIME=PASS
