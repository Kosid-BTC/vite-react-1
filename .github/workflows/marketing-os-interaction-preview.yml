name: Marketing OS Interaction Preview

on:
  push:
    branches:
      - fix/marketing-os-interactions-v4

permissions:
  contents: read

concurrency:
  group: marketing-os-interaction-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN_PRIMARY: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TOKEN_ACCESS: ${{ secrets.VERCEL_ACCESS_TOKEN }}
      VERCEL_TOKEN_API: ${{ secrets.VERCEL_API_TOKEN }}
      VERCEL_TOKEN_CLI: ${{ secrets.VERCEL_CLI_TOKEN }}
      VERCEL_PROJECT_ID: prj_hfiFu2Ho2LQqSDlqy1oA0TaT4MWw
      VERCEL_ORG_ID: team_oryw9VGF4TLakA4qBU6pGx43
      VERCEL_TEAM_SLUG: kosid-btcs-projects
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Assert exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "INTERACTION_SHA_VERIFIED=$GITHUB_SHA"

      - name: Resolve Vercel credential
        shell: bash
        run: |
          set -euo pipefail
          token="${VERCEL_TOKEN_PRIMARY:-}"
          if [ -z "$token" ] && [ -n "${VERCEL_TOKEN_ACCESS:-}" ]; then token="$VERCEL_TOKEN_ACCESS"; fi
          if [ -z "$token" ] && [ -n "${VERCEL_TOKEN_API:-}" ]; then token="$VERCEL_TOKEN_API"; fi
          if [ -z "$token" ] && [ -n "${VERCEL_TOKEN_CLI:-}" ]; then token="$VERCEL_TOKEN_CLI"; fi
          test -n "$token"
          echo "::add-mask::$token"
          echo "VERCEL_TOKEN=$token" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/marketing-os/package-lock.json

      - name: Install
        working-directory: apps/marketing-os
        run: npm ci --no-audit --no-fund

      - name: Bind correct Vercel project
        working-directory: apps/marketing-os
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .vercel
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          npx --yes vercel@59.11.7 pull --yes --environment=preview --scope="$VERCEL_TEAM_SLUG" --token="$VERCEL_TOKEN"
          grep -q "$VERCEL_PROJECT_ID" .vercel/project.json
          echo AUTHORITATIVE_VERCEL_PROJECT=ceo-ai-marketing-os

      - name: Inject exact preview QA SHA
        working-directory: apps/marketing-os
        shell: bash
        run: |
          set -euo pipefail
          printf '\nVERCEL_GIT_COMMIT_SHA="%s"\nVISUAL_QA_COMMIT_SHA="%s"\n' "$GITHUB_SHA" "$GITHUB_SHA" >> .vercel/.env.preview.local
          grep -q "VISUAL_QA_COMMIT_SHA=\"$GITHUB_SHA\"" .vercel/.env.preview.local
          echo PREVIEW_QA_SHA_INJECTED="$GITHUB_SHA"

      - name: Build preview
        working-directory: apps/marketing-os
        run: npx --yes vercel@59.11.7 build --scope="$VERCEL_TEAM_SLUG" --token="$VERCEL_TOKEN"

      - name: Deploy preview
        id: deploy
        working-directory: apps/marketing-os
        shell: bash
        run: |
          set -euo pipefail
          url="$(npx --yes vercel@59.11.7 deploy --prebuilt --scope="$VERCEL_TEAM_SLUG" --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "INTERACTION_PREVIEW_URL=$url"

      - name: Install interaction E2E tools
        working-directory: apps/marketing-os
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0 vercel@59.11.7
          npx playwright install --with-deps chromium

      - name: Protected preview interaction E2E
        working-directory: apps/marketing-os
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { execFile } from 'node:child_process';
          import { promisify } from 'node:util';
          import { extname } from 'node:path';

          const execFileAsync = promisify(execFile);
          const deployment = process.env.DEPLOYMENT_URL;
          const sha = process.env.GITHUB_SHA;
          const team = process.env.VERCEL_TEAM_SLUG;
          if (!deployment || !sha || !team || !process.env.VERCEL_TOKEN) throw new Error('Missing interaction E2E inputs');

          const mime = (url, resourceType) => {
            const ext = extname(new URL(url).pathname).toLowerCase();
            if (resourceType === 'document' || ext === '.html') return 'text/html; charset=utf-8';
            if (ext === '.js' || ext === '.mjs' || resourceType === 'script') return 'application/javascript; charset=utf-8';
            if (ext === '.css' || resourceType === 'stylesheet') return 'text/css; charset=utf-8';
            if (ext === '.svg') return 'image/svg+xml';
            if (ext === '.png') return 'image/png';
            if (ext === '.jpg' || ext === '.jpeg') return 'image/jpeg';
            if (ext === '.woff2') return 'font/woff2';
            if (ext === '.woff') return 'font/woff';
            return 'application/octet-stream';
          };

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });

          await page.route('**/*', async (route) => {
            const request = route.request();
            const url = request.url();
            if (!url.startsWith(`${deployment}/`)) return route.continue();
            try {
              const { stdout } = await execFileAsync(
                './node_modules/.bin/vercel',
                [`--scope=${team}`, 'curl', url],
                { encoding: 'buffer', maxBuffer: 32 * 1024 * 1024, env: process.env },
              );
              await route.fulfill({ status: 200, body: stdout, contentType: mime(url, request.resourceType()) });
            } catch (error) {
              console.error(`VERCEL_CURL_PROXY_FAILURE=${url}`);
              console.error(error?.stderr?.toString?.().slice(0, 2000) ?? error);
              await route.abort();
            }
          });

          const goHome = async () => {
            await page.goto(`${deployment}/visual-qa/home?visualQa=${encodeURIComponent(sha)}`, { waitUntil: 'networkidle' });
            await page.locator('[data-visual-qa="preview-fixture"]').waitFor({ state: 'visible', timeout: 20000 });
          };

          const expectFeature = async (path, heading) => {
            await page.waitForURL((url) => url.pathname === `/visual-qa/feature/${path}` && url.searchParams.get('visualQa') === sha);
            await page.getByRole('heading', { name: heading }).waitFor();
          };

          try {
            await goHome();
            await page.getByText('Audience', { exact: true }).click();
            await expectFeature('audience', 'Audience');

            await goHome();
            await page.getByText('Content Calendar', { exact: true }).click();
            await expectFeature('content-calendar', 'Content Calendar');

            await goHome();
            await page.getByText('Business Genome', { exact: true }).first().click();
            await expectFeature('business-genome', 'Business Genome');

            await goHome();
            await page.getByText('RLS / Security', { exact: true }).click();
            await expectFeature('rls-security', 'RLS / Security');

            await goHome();
            await page.locator('.global-search').click();
            await expectFeature('search', 'Global Search');

            console.log(`INTERACTION_E2E_SHA=${sha}`);
            console.log('INTERACTION_NAVIGATION_E2E=PASS');
            console.log('INTERACTION_KEY_FEATURES=Audience|Content Calendar|Business Genome|RLS Security|Global Search');
          } finally {
            await browser.close();
          }
          NODE
