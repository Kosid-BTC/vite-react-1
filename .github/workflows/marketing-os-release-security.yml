name: Marketing OS Release Security

on:
  push:
    branches:
      - feat/marketing-os-phase1
      - feat/marketing-os-executive-growth-v3
    paths:
      - 'apps/marketing-os/config/security-definer-classification.json'
      - 'apps/marketing-os/scripts/verify-release-security-boundaries-local.mjs'
      - 'apps/marketing-os/scripts/verify-release-readiness-security.mjs'
      - 'apps/marketing-os/package.json'
      - 'apps/marketing-os/package-lock.json'
      - 'supabase/migrations/**'
      - '.github/workflows/marketing-os-release-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-security:
    name: Local release-security evidence
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assert exact workflow head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "RELEASE_SECURITY_SHA_VERIFIED=${GITHUB_SHA}"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/marketing-os/package-lock.json
      - name: Install Marketing OS dependencies
        working-directory: apps/marketing-os
        run: npm ci --no-audit --no-fund
      - name: Verify Docker
        run: docker info
      - name: Start disposable local Supabase
        run: npx --yes supabase@2.40.0 start
      - name: Migration reset / reapply #1
        run: npx --yes supabase@2.40.0 db reset --local
      - name: Migration reset / reapply #2
        run: npx --yes supabase@2.40.0 db reset --local
      - name: Direct local authorization-boundary verification
        shell: bash
        run: |
          set -euo pipefail
          eval "$(npx --yes supabase@2.40.0 status -o env)"
          export SUPABASE_URL="$API_URL"
          export SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"

          psql "$DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          create table if not exists public.youtube_projects (id uuid primary key default gen_random_uuid());
          create table if not exists public.youtube_quota (id uuid primary key default gen_random_uuid());
          alter table public.youtube_projects enable row level security;
          alter table public.youtube_quota enable row level security;
          SQL
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260904072500_release_security_reconcile.sql

          cd apps/marketing-os
          npm run test:release-security-boundaries
          echo "RELEASE_SECURITY_BOUNDARIES=PASS" >> "$GITHUB_ENV"
      - name: Release security fail-closed classification
        working-directory: apps/marketing-os
        run: npm run test:release-security
      - name: Stop disposable local Supabase
        if: always()
        run: npx --yes supabase@2.40.0 stop --no-backup
