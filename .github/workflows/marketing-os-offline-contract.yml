name: Marketing OS offline CEO Back Office contract
on:
  pull_request:
    paths:
      - 'apps/marketing-os/src/lib/marketing-intelligence/**'
      - 'apps/marketing-os/scripts/verify-ceo-backoffice-offline-contract.ts'
      - 'apps/marketing-os/package.json'
      - '.github/workflows/marketing-os-offline-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/marketing-os
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install app dependencies without running lifecycle scripts
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Verify offline mapping and evidence contract
        run: npm run test:ceo-backoffice-offline
